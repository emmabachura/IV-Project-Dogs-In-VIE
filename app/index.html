<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vienna Dog Zones Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header class="page-header">
    <h1>Dog-Friendly Spaces in Vienna</h1>
    <p>Analyzing access to dog zones relative to registered dogs.</p>
</header>

<main class="dashboard-layout">
    <div id="map" class="map-panel"></div>

    <section id="sidebar" class="dashboard-panel">
        <div class="panel-header">
            <h2 id="chart-title">Dog Zone Area vs. Registered Dogs</h2>
            <p id="chart-description">Explore how individual dog zones relate to district-level dog counts.</p>
        </div>
        <div id="scatterplot"></div>

        <div id="filters" class="control-row">
            <button id="toggle-heatmap" class="primary-button">
                Show Infrastructure Heatmap (250 Tracts)
            </button>
        </div>
    </section>
</main>
<div id="area-filter" class="dashboard-panel filter-panel">
    <label for="area-slider">
        Maximum Dog Zone Area
    </label>
    <br>
    <input id="area-slider" type="range" min="0" max="100" value="100" step="1">
    <p id="area-filter-summary"></p>
</div>
<script src="/static/main.js"></script>
</body>
</html>
