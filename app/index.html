<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vienna Dog Zones Visualization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header class="page-header">
    <h1>Dog-Friendly Spaces in Vienna</h1>
    <p>Analyzing access to dog zones relative to registered dogs.</p>
</header>

<main class="dashboard-layout">
    <div id="map" class="map-panel"></div>

    <section id="sidebar" class="dashboard-panel">
        <div class="panel-header">
            <h2 id="chart-title">Dog Zone Area vs. Registered Dogs</h2>
            <p id="chart-description">Explore how individual dog zones relate to district-level dog counts.</p>
        </div>
        <div id="scatterplot"></div>

        <div id="filters" class="control-row">
            <button id="toggle-heatmap" class="primary-button">
                Heatmap View
            </button>
        </div>

        <section id="legend-panel" class="legend-panel" aria-labelledby="legend-title">
            <div class="legend-header">
                <h3 id="legend-title">Legend</h3>
                <p id="legend-description">How to read the current map and chart encodings.</p>
            </div>
            <div id="legend-content"></div>
        </section>
    </section>
</main>
<div id="area-filter" class="dashboard-panel filter-panel">
    <label for="area-slider">
        Maximum Dog Zone Area
    </label>
    <br>
    <input id="area-slider" type="range" min="0" max="100" value="100" step="1">
    <div class="filter-grid" aria-label="Dog zone filters">
        <div class="filter-field">
            <label for="water-filter">Water</label>
            <select id="water-filter">
                <option value="all">All zones</option>
                <option value="yes">Water available</option>
                <option value="no">No water</option>
            </select>
        </div>
        <div class="filter-field">
            <label for="fenced-filter">Fenced</label>
            <select id="fenced-filter">
                <option value="all">All zones</option>
                <option value="yes">Fully fenced</option>
                <option value="partially">Partially fenced</option>
                <option value="no">Not fenced</option>
            </select>
        </div>
        <div class="filter-field">
            <label for="zone-type-filter">Zone type</label>
            <select id="zone-type-filter">
                <option value="all">All zone types</option>
                <option value="dedicated">Dedicated dog zones</option>
                <option value="general">General dog areas</option>
            </select>
        </div>
    </div>
    <p id="area-filter-summary"></p>
</div>
<script src="/static/main.js"></script>
</body>
</html>
